name: graal-tests
services:
  db_test:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_USER: synthetic_runner
      POSTGRES_PASSWORD: synthetic_test_only
      POSTGRES_DB: graal_test
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      test: [CMD, pg_isready, -U, synthetic_runner, -d, graal_test]
      interval: 2s
      timeout: 5s
      retries: 30
  tests:
    build: {context: ., target: test}
    # Compartilha a rede do banco: as suítes exigem PostgreSQL em loopback.
    network_mode: service:db_test
    environment:
      TEST_DATABASE_URL: postgresql://synthetic_runner:synthetic_test_only@127.0.0.1:5432/graal_test
    depends_on: {db_test: {condition: service_healthy}}
