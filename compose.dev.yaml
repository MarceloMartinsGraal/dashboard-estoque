# Pilha completa para testes locais via Docker (HTTP em http://localhost:8080).
# Não é configuração de produção: sem HTTPS, NODE_ENV=development e cookie sem Secure.
name: graal-dev
services:
  db:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-graal_owner}
      POSTGRES_DB: ${POSTGRES_DB:-graal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Defina DB_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/init-db.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: {context: ., target: runtime}
    command: [node, dist/backend/migrate.js]
    environment: &api-env
      NODE_ENV: development
      PORT: '3000'
      PUBLIC_ORIGIN: http://localhost:8080
      SESSION_SECRET: ${SESSION_SECRET:?Defina SESSION_SECRET}
      DATABASE_URL: postgresql://graal_app:${DB_APP_PASSWORD:?Defina DB_APP_PASSWORD}@db:5432/${POSTGRES_DB:-graal}
    depends_on: {db: {condition: service_healthy}}
    restart: 'no'
  api:
    volumes:
      - invoices:/var/lib/graal/invoices
    build: {context: ., target: runtime}
    init: true
    environment: *api-env
    depends_on:
      migrate: {condition: service_completed_successfully}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    build: {context: ., target: web}
    ports: ['127.0.0.1:8080:80']
    volumes:
      - ./infra/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: {api: {condition: service_healthy}}
volumes:
  pgdata:
  invoices:
