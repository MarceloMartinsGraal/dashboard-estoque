limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
server {
    listen 80;
    server_name estoque.exemplo.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://estoque.exemplo.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name estoque.exemplo.com;
    ssl_certificate /etc/letsencrypt/live/estoque.exemplo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/estoque.exemplo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 12m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    root /usr/share/nginx/html;
    index index.html;
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    # Somente upload documental aceita corpo de até21MiB; backend limita PDF a20MiB.
    location = /api/invoices {
        client_max_body_size 21m;
        client_body_timeout 30s;
        proxy_request_buffering off;
        proxy_pass http://api:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
