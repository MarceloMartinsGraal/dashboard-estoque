# Somente compose.same-host.yaml: porta publicada em127.0.0.1, atrás do proxy HTTPS do host.
# O proxy HTTPS do host DEVE sobrescrever X-Graal-Client-IP com o IP real do cliente.
# Somente a porta127.0.0.1 do Compose expõe este listener; não publicar diretamente.
map $http_x_graal_client_ip $graal_client_ip {
    default "";
    ~^[0-9a-fA-F:.]+$ $http_x_graal_client_ip;
}
limit_req_zone $graal_client_ip zone=login:10m rate=10r/m;
server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 12m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    root /usr/share/nginx/html;
    index index.html;
    location = /api/auth/login {
        if ($graal_client_ip = "") { return 503; }
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $graal_client_ip;
    }
    # Somente upload documental aceita corpo de até21MiB; backend limita PDF a20MiB.
    location = /api/invoices {
        client_max_body_size 21m;
        client_body_timeout 30s;
        proxy_request_buffering off;
        proxy_pass http://api:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $graal_client_ip;
        proxy_read_timeout 120s;
    }
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $graal_client_ip;
        proxy_read_timeout 120s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
