# Somente para compose.dev.yaml (teste local em HTTP). Produção usa nginx.production.conf.
server {
    listen 80;
    server_name localhost;
    server_tokens off;
    client_max_body_size 12m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    root /usr/share/nginx/html;
    index index.html;
    # Somente upload documental aceita corpo de até21MiB; backend limita PDF a20MiB.
    location = /api/invoices {
        client_max_body_size 21m;
        client_body_timeout 30s;
        proxy_request_buffering off;
        proxy_pass http://api:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
